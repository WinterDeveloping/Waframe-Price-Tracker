name: Collect prices

on:
  schedule:
    - cron: "17 * * * *"   # every hour at :17 (UTC); off the busy top of the hour
  workflow_dispatch:        # "Run workflow" button for manual runs

permissions:
  contents: write           # lets the job commit the new data

concurrency:
  group: collect
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 25  # ~700 items at 2.5 requests/second is about 5 minutes
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Snapshot prices
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          WFM_PLATFORM: ${{ vars.WFM_PLATFORM || 'pc' }}
        run: python collector/collect.py

      - name: Commit data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data
          if git diff --cached --quiet; then
            echo "no changes"
            exit 0
          fi
          git commit -m "data: snapshot $(date -u +%Y-%m-%dT%H:00Z)"
          git pull --rebase
          git push
